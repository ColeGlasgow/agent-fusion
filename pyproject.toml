[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-fusion"
version = "0.0.1"
description = "Unified multi-agent orchestration: route tasks to the best coding agent, run them under enterprise-quality skill profiles."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_fusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
